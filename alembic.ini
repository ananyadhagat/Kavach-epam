# Alembic configuration for the KAVACH consolidation store.
#
# The database URL is intentionally left blank. Set KAVACH_DATABASE_URL (or
# DATABASE_URL), or pass the URL explicitly, before running migrations:
#
#     $env:KAVACH_DATABASE_URL = "postgresql://user:pass@host:5432/kavach"
#     alembic upgrade head
#
# For a throwaway local SQLite database:
#
#     $env:KAVACH_DATABASE_URL = "sqlite:///./kavach_local.db"
#     alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
