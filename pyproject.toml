[project]
name = "sanitation-agent"
version = "0.1.0"
description = "KAVACH Sanitation Agent using FastAPI, Gemini, and LangGraph"
readme = "README.md"
authors = [
    { name = "Namrata Digarse", email = "namratadigarse1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai",
    "langgraph",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
sanitation-agent = "sanitation_agent:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
